name: DeXRay APK Build

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建 Android APK'
        required: false
        default: true
        type: boolean
      publish_release:
        description: '发布到 Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release 标签 (发布时填)'
        required: false
        default: ''
        type: string

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  build-android:
    if: ${{ github.event.inputs.build_android == 'true' || github.event_name == 'push' }}
    name: 构建 Android APK
    runs-on: ubuntu-latest
    permissions: write-all
    defaults:
      run:
        working-directory: kelivo-src

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 📝 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}_${SHORT_SHA}" >> $GITHUB_ENV
          echo "版本号: ${VERSION}_${SHORT_SHA}"

      - name: 🔑 写入签名密钥 (如配置)
        if: ${{ env.SIGN_KEYSTORE_BASE64 != '' }}
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          echo "storeFile=key.jks" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "✅ 签名配置已写入"

      - name: 🏗️ 构建 APK
        run: flutter build apk --release --split-per-abi

      - name: 📦 重命名 APK
        run: |
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$file" "DeXRay_android_${VERSION}_${abi}.apk"
          done

      - name: ⬆️ 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dexray-apk
          path: kelivo-src/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: 🚀 发布到 Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          files: kelivo-src/build/app/outputs/flutter-apk/*.apk
