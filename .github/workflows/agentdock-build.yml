name: agentdock-android-build

on:
  workflow_dispatch:

concurrency:
  group: agentdock-android
  cancel-in-progress: true

jobs:
  build:
    name: Build AgentDock Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_VERSION: "8.13"
      AGENTDOCK_ASSET_BASE: android/app/src/main/assets/agentdock

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Cross-compile agentdock core (GOOS=android, CGO_ENABLED=0)
        run: |
          set -euo pipefail
          cd go
          mkdir -p "../$AGENTDOCK_ASSET_BASE"
          commit="$(git rev-parse --short=12 HEAD 2>/dev/null || echo unknown)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/uvwt/agentdock/internal/buildinfo.Commit=$commit -X github.com/uvwt/agentdock/internal/buildinfo.BuildDate=$build_date"
          for spec in "arm64-v8a arm64" "x86_64 amd64"; do
            abi="${spec% *}"
            arch="${spec#* }"
            out="../$AGENTDOCK_ASSET_BASE/$abi/agentdock"
            mkdir -p "$(dirname "$out")"
            echo "Building $abi (GOARCH=$arch) -> $out"
            CGO_ENABLED=0 GOOS=android GOARCH=$arch go build -trimpath -ldflags="$ldflags" -o "$out" ./cmd/agentdock
          done
          ls -la "../$AGENTDOCK_ASSET_BASE"/*/agentdock

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.kts', 'android/**/*.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Pre-install Android platform/build-tools
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          platform_version=$($ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list 2>/dev/null | grep -oE 'platforms;android-3[0-9]' | sort -uV | tail -1 || true)
          for pkg in "platforms;android-36" "build-tools;35.0.0" "$platform_version"; do
            [ -z "$pkg" ] && continue
            yes | "$SDKMANAGER" "$pkg" >/dev/null 2>&1 || true
          done
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Build release APK
        run: |
          set -euo pipefail
          cd android
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14